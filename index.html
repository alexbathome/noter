<html>

<head>
    <title>My Web Page</title>
    <meta name="color-scheme" content="light dark">
    <style>
        @font-face {
            font-family: 'SpaceMono';
            src: url('fonts/SpaceMonoNerdFont-Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        @font-face {
            font-family: 'SpaceMono';
            src: url('fonts/SpaceMonoNerdFont-Bold.ttf') format('truetype');
            font-weight: bold;
            font-style: normal;
        }

        @font-face {
            font-family: 'SpaceMono';
            src: url('fonts/SpaceMonoNerdFont-Italic.ttf') format('truetype');
            font-weight: normal;
            font-style: italic;
        }

        @font-face {
            font-family: 'SpaceMono';
            src: url('fonts/SpaceMonoNerdFont-BoldItalic.ttf') format('truetype');
            font-weight: bold;
            font-style: italic;
        }

        :root {
            --bg: #fff;
            --bg-alt: #f5f5f5;
            --bg-selected: #f0f0f0;
            --border: #ddd;
            --text: #333;
            --text-dim: #666;
            --text-faint: #999;
            --text-disabled: #bbb;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1e1e1e;
                --bg-alt: #2a2a2a;
                --bg-selected: #333;
                --border: #3c3c3c;
                --text: #d4d4d4;
                --text-dim: #999;
                --text-faint: #6e6e6e;
                --text-disabled: #555;
            }
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        body>div {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: minmax(0, 1fr);
            height: 100%;
            font: 14px 'SpaceMono', monospace;
            color: var(--text);
            background: var(--bg);
        }

        #zones {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: minmax(0, 1fr) minmax(0, 1fr);
            gap: 1px;
            background: var(--border);
            min-height: 0;
        }

        .zone {
            display: flex;
            flex-direction: column;
            background: var(--bg);
            padding: 0.1rem;
            min-height: 0;
        }

        .zone>header {
            display: flex;
            justify-content: space-between;
            margin-bottom: .5rem;
            text-transform: uppercase;
            letter-spacing: .05em;
            font-size: .75rem;
            color: var(--text-dim);
        }

        .zone>header>button {
            border: 0;
            background: none;
            cursor: pointer;
            font-size: 1rem;
            line-height: 1;
            color: var(--text-dim);
        }

        .list {
            display: flex;
            flex-direction: column;
            gap: .25rem;
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            overscroll-behavior: contain;
        }

        .list> :first-child {
            margin-top: auto;
        }

        .list.over {
            background: var(--bg-alt);
        }

        .task {
            flex-shrink: 0;
            border: 1px solid var(--border);
            border-radius: 3px;
            padding: .4rem .5rem;
            background: var(--bg);
            cursor: grab;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .task.selected {
            border-color: var(--text-dim);
            background: var(--bg-selected);
        }

        .task.empty {
            color: var(--text-faint);
        }

        .task.dragging {
            opacity: .4;
        }

        #pane {
            display: flex;
            flex-direction: column;
            min-width: 0;
            border-left: 1px solid var(--border);
        }

        #toolbar {
            display: flex;
            justify-content: flex-end;
            padding: .5rem .1rem;
            border-bottom: 1px solid var(--border);
        }

        #toolbar>button {
            border: 1px solid var(--border);
            border-radius: 3px;
            background: var(--bg);
            padding: .1rem .1rem;
            cursor: pointer;
            font: inherit;
            font-size: .8rem;
            color: var(--text);
        }

        #toolbar>button:disabled {
            color: var(--text-disabled);
            cursor: default;
        }

        #editor {
            flex: 1;
            min-height: 0;
        }
    </style>
</head>

<body>
    <div>
        <div id="zones">
            <div class="zone" id="todo">
                <header>todo<button>+</button></header>
                <div class="list"></div>
            </div>
            <div class="zone" id="doing">
                <header>doing<button>+</button></header>
                <div class="list"></div>
            </div>
            <div class="zone" id="blocked">
                <header>blocked<button>+</button></header>
                <div class="list"></div>
            </div>
            <div class="zone" id="done">
                <header>done<button>+</button></header>
                <div class="list"></div>
            </div>
        </div>
        <div id="pane">
            <div id="toolbar"><button id="delete" disabled>Delete task</button></div>
            <div id="editor"></div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js"></script>
    <script>
        var editor, selected, dragging, syncing;

        function render(task) {
            var title = task._text.split('\n')[0].trim();
            task.textContent = title || 'Untitled';
            task.classList.toggle('empty', !title);
        }

        function select(task) {
            if (selected) selected.classList.remove('selected');
            selected = task;
            task.classList.add('selected');
            syncing = true;
            editor.setValue(task._text);
            syncing = false;
            editor.updateOptions({ readOnly: false });
            editor.focus();
            document.getElementById('delete').disabled = false;
        }

        function deselect() {
            if (selected) selected.classList.remove('selected');
            selected = null;
            syncing = true;
            editor.setValue('');
            syncing = false;
            editor.updateOptions({ readOnly: true });
            document.getElementById('delete').disabled = true;
        }

        function dropBefore(list, y) {
            var tasks = list.querySelectorAll('.task:not(.dragging)');
            for (var i = 0; i < tasks.length; i++) {
                var box = tasks[i].getBoundingClientRect();
                if (y < box.top + box.height / 2) return tasks[i];
            }
            return null;
        }

        function addTask(list, text) {
            var task = document.createElement('div');
            task.className = 'task';
            task.draggable = true;
            task._text = text || '';
            render(task);
            task.onclick = function () { select(task); };
            task.ondragstart = function (e) {
                dragging = task;
                e.dataTransfer.setData('text/plain', '');
                setTimeout(function () { task.classList.add('dragging'); });
            };
            task.ondragend = function () {
                task.classList.remove('dragging');
                dragging = null;
                document.querySelectorAll('.list.over').forEach(function (l) {
                    l.classList.remove('over');
                });
            };
            list.appendChild(task);
            return task;
        }

        document.querySelectorAll('.zone').forEach(function (zone) {
            var list = zone.querySelector('.list');

            zone.querySelector('button').onclick = function () {
                select(addTask(list));
            };

            list.ondragover = function (e) {
                e.preventDefault();
                list.classList.add('over');
                if (dragging) list.insertBefore(dragging, dropBefore(list, e.clientY));
            };
            list.ondragleave = function () { list.classList.remove('over'); };
            list.ondrop = function (e) {
                e.preventDefault();
                list.classList.remove('over');
            };
        });

        document.getElementById('delete').onclick = function () {
            if (!selected) return;
            selected.remove();
            deselect();
        };

        var darkMode = window.matchMedia('(prefers-color-scheme: dark)');

        require.config({ paths: { vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs' } });
        require(['vs/editor/editor.main'], function () {
            editor = monaco.editor.create(document.getElementById('editor'), {
                value: '',
                language: 'markdown',
                automaticLayout: true,
                readOnly: true,
                minimap: { enabled: false },
                theme: darkMode.matches ? 'vs-dark' : 'vs',
                fontFamily: 'SpaceMono, monospace',
                fontLigatures: true
            });

            document.fonts.ready.then(function () { monaco.editor.remeasureFonts(); });

            darkMode.onchange = function (e) {
                monaco.editor.setTheme(e.matches ? 'vs-dark' : 'vs');
            };

            editor.onDidChangeModelContent(function () {
                if (syncing || !selected) return;
                selected._text = editor.getValue();
                render(selected);
            });
        });
    </script>
</body>

</html>
